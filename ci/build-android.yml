# GitHub Actions workflow для сборки Android APK.
# Переместите этот файл в .github/workflows/build-android.yml
# (API GitHub не позволяет изменять workflow-файлы без scope 'workflow').

name: Build Android APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;27.0.12077973"

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        cache-read-only: false

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Generate SQLDelight interfaces
      run: ./gradlew :shared:generateMainNoteDatabaseInterface --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build unsigned release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-release-apk
        path: |
          **/build/outputs/apk/release/*.apk
        retention-days: 30
